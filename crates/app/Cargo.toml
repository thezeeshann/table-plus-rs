[package]
name = "table-plus-rs"
description = "table-plus-rs - a fast, native PostgreSQL desktop client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "table-plus-rs"
path = "src/main.rs"

[dependencies]
table-plus-core = { path = "../core" }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
log = "0.4"
env_logger = "0.11"
dirs = "6"
rfd = "0.17"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "persistence", "accesskit"] }
egui_extras = "0.36"
png = "0.17"
